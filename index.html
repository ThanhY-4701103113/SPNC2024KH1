<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Học tập cùng Ý</title>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<a-scene vr-mode-ui="enabled: false">
  <!-- Camera -->
  <a-camera id="camera" look-controls position="0 1.6 0"></a-camera>

  <!-- Box sẽ thay đổi kích thước -->
  <a-box id="box" position="0 1 -5" scale="1 1 1" color="blue"></a-box>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const camera = document.querySelector("#camera");
      const box = document.querySelector("#box");

      // Hàm tính khoảng cách giữa camera và box
      function calculateDistance() {
        const cameraPosition = camera.object3D.position; // Lấy vị trí của camera (Three.js Vector3)
        const boxPosition = box.object3D.position; // Lấy vị trí của box (Three.js Vector3)

        // Tính khoảng cách giữa camera và box
        const distance = cameraPosition.distanceTo(boxPosition);
        return distance;
      }

      // Hàm cập nhật scale dựa trên khoảng cách
      function updateBoxScale() {
        const distance = calculateDistance();
        console.log("Khoảng cách:", distance);

        // Scale box dựa trên khoảng cách (giảm dần khi xa, tăng khi gần)
        const scale = Math.max(0.5, 5 / distance); // Quy đổi scale theo khoảng cách
        box.setAttribute("scale", `${scale} ${scale} ${scale}`);
      }

      // Cập nhật kích thước box mỗi frame
      const scene = document.querySelector("a-scene");
      scene.addEventListener("tick", updateBoxScale);
    });
  </script>
</a-scene>
  <script src="index.js">
  </script>
</body>
</html>
