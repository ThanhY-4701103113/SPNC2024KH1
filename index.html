<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Học tập cùng Ý</title>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <a-scene>
    <!-- Thêm ánh sáng để box hiển thị rõ -->
    <a-light type="directional" position="0 5 5" intensity="1"></a-light>
    <a-light type="ambient" intensity="0.5"></a-light>

    <!-- Thêm camera với look-controls để di chuyển quanh box -->
    <a-camera position="0 1.6 0" look-controls>
      <a-entity position="0 0 -3">
        <a-text value="Move around to view the box!" color="black" align="center"></a-text>
      </a-entity>
    </a-camera>

    <!-- Box cố định trong không gian -->
    <a-box position="0 1 -5" rotation="0 45 0" color="blue" depth="1" height="1" width="1"></a-box>
  </a-scene>
  <script src="index.js">
  </script>
</body>
</html>
