<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Học tập cùng Ý</title>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <a-scene vr-mode-ui="enabled: false" embedded>
    <!-- Camera -->
    <a-camera>
    </a-camera>
  
    <!-- Đối tượng xoay quanh -->
    <a-box position="0 1 -5" rotation="0 45 0" color="red" scale="1 1 1" look-at="[camera]">
    </a-box>
    <!-- Thành phần tùy chỉnh -->
  <script>
    AFRAME.registerComponent('distance-scale', {
      schema: {
        minScale: {type: 'number', default: 0.5}, // Kích thước tối thiểu
        maxScale: {type: 'number', default: 3},  // Kích thước tối đa
      },
      tick: function () {
        const cameraEl = document.querySelector('#camera');
        const objectEl = this.el;

        // Lấy vị trí của camera và đối tượng
        const cameraPosition = cameraEl.object3D.position;
        const objectPosition = objectEl.object3D.position;

        // Tính khoảng cách giữa camera và đối tượng
        const distance = cameraPosition.distanceTo(objectPosition);

        // Tính toán scale dựa trên khoảng cách (tăng/giảm kích thước)
        const scale = THREE.MathUtils.clamp(distance / 5, this.data.minScale, this.data.maxScale);
        objectEl.setAttribute('scale', `${scale} ${scale} ${scale}`);
      }
    });
  </script>

  </a-scene>
  
</body>
</html>
